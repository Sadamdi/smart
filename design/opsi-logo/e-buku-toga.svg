<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="SMART">
  <style>
    .k{transform-box:fill-box;opacity:0;animation:buka .7s cubic-bezier(.2,.8,.2,1) .2s forwards}
    .kiri{transform-origin:100% 50%}.kanan{transform-origin:0 50%;animation-delay:.35s}
    @keyframes buka{from{opacity:0;transform:scaleX(.05)}to{opacity:1;transform:none}}
    .badan{opacity:0;animation:naik .5s ease-out 1s forwards}
    @keyframes naik{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .jumbai{transform-box:fill-box;transform-origin:50% 0;animation:ayun 3.2s ease-in-out 1.6s infinite}
    @keyframes ayun{0%,100%{transform:rotate(0)}30%{transform:rotate(6deg)}65%{transform:rotate(-4deg)}}
    .bt{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .45s cubic-bezier(.3,1.6,.5,1) 1.5s forwards}
    @keyframes pop{from{transform:scale(0)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.k,.badan,.bt{animation:none;opacity:1;transform:none}.jumbai{animation:none}}
  </style>
  <path class="badan" d="M25 47V63C25 71 75 71 75 63V47L50 57Z" fill="#0E2D5A"/>
  <path class="k kiri" d="M50 13L7 33L50 55Z" fill="#143F7C"/>
  <path class="k kanan" d="M50 13L93 33L50 55Z" fill="#2B6BC0"/>
  <path d="M50 13V55" stroke="#EAF1FF" stroke-width="1.6"/>
  <g class="jumbai">
    <path d="M87 34V60" stroke="#F5B73B" stroke-width="3" stroke-linecap="round"/>
    <path class="bt" d="M87 59L89 64L94 66L89 68L87 73L85 68L80 66L85 64Z" fill="#F5B73B"/>
  </g>
</svg>
