<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="SMART"><style>
  .bs{transform-box:fill-box;transform-origin:center;animation:boil .55s steps(1) infinite}
  .bs2{animation-direction:reverse;animation-duration:.55s}
  @keyframes boil{0%{transform:rotate(0) scale(1)}50%{transform:rotate(4deg) scale(1.03)}}
  .bm{transform-box:fill-box;transform-origin:center;animation:ledak .45s cubic-bezier(.2,1.6,.4,1) .05s both}
  @keyframes ledak{from{transform:scale(0) rotate(-30deg)}}
  .cap{animation:banting .4s cubic-bezier(.3,1.4,.5,1) .35s both}
  @keyframes banting{from{transform:translateY(-90px) skewX(-18deg);opacity:0}60%{opacity:1}}
  .pl{animation:tampar .35s cubic-bezier(.2,1.5,.4,1) var(--d) both}
  @keyframes tampar{from{transform:translateY(-70px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.bs,.bm,.cap,.pl{animation:none}}
</style>
