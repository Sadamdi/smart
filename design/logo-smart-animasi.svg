<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="SMART">
  <style>
    .t{transform-box:view-box;transform-origin:60px 52px;animation:unfold 1.1s cubic-bezier(.3,.7,.2,1) both}
    .d1{animation-delay:.1s}.d2{animation-delay:.22s}.d3{animation-delay:.34s}.d4{animation-delay:.46s}
    .base{animation:drop .6s cubic-bezier(.3,.7,.2,1) both}
    .tas{transform-box:view-box;transform-origin:106px 52px;animation:swing 1.6s ease-out 1.05s both}
    .tas2{animation:fade .3s ease-out .9s both}
    @keyframes unfold{from{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}to{transform:none;opacity:1}}
    @keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
    @keyframes swing{0%{transform:rotate(-30deg)}30%{transform:rotate(26deg)}55%{transform:rotate(-12deg)}78%{transform:rotate(5deg)}to{transform:rotate(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.t,.base,.tas,.tas2{animation:none}}
  </style>
  <rect width="120" height="120" rx="26" fill="#143F7C"/>
  <g transform="translate(60 60) scale(.9) translate(-60 -57)">
    <path class="base" d="M36 62V84C45 92 75 92 84 84V62L60 74Z" fill="#7FA8E0"/>
    <polygon class="t d1" points="60,52 60,22 14,52" fill="#BCD2F1"/>
    <polygon class="t d2" points="60,52 60,22 106,52" fill="#FFFFFF"/>
    <polygon class="t d3" points="60,52 106,52 60,82" fill="#3E83D6"/>
    <polygon class="t d4" points="60,52 60,82 14,52" fill="#7FA8E0"/>
    <g class="tas"><g class="tas2"><line x1="106" y1="52" x2="106" y2="78" stroke="#F5B73B" stroke-width="3.5"/><rect x="101" y="78" width="10" height="13" fill="#F5B73B"/></g></g>
  </g>
</svg>
