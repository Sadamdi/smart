org.gradle.jvmargs=-Xmx16G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Windows: pustaka Pub di drive C dan proyek di drive lain merusak cache inkremental Kotlin
kotlin.incremental=false

# Build lebih cepat: paralel, cache hasil tugas, pekerja sesuai core (i7-12650H, 16 thread)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=14
org.gradle.daemon=true
org.gradle.vfs.watch=true
kotlin.daemon.jvmargs=-Xmx4G
