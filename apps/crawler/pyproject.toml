[project]
name = "smart-crawler"
version = "0.1.0"
description = "Pemantau beasiswa SMART"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Dipasang saat sumber yang membutuhkannya dikerjakan (F3); berat karena memuat peramban.
crawl = ["crawl4ai>=0.4"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
